name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Smart Unzip & Flatten Project Files
      run: |
        python3 -c "
        import zipfile, os, shutil
        zips = [f for f in os.listdir('.') if f.endswith('.zip') or f.endswith('.ZIP')]
        if zips:
            zip_name = zips[0]
            print(f'Extracting {zip_name}...')
            with zipfile.ZipFile(zip_name, 'r') as z:
                z.extractall('temp_extracted')
            os.remove(zip_name)
            
            # If zip contains a single root folder, unwrap it to root
            items = os.listdir('temp_extracted')
            if len(items) == 1 and os.path.isdir(os.path.join('temp_extracted', items[0])):
                source_dir = os.path.join('temp_extracted', items[0])
            else:
                source_dir = 'temp_extracted'
                
            # Move all project contents directly to current root (.)
            for item in os.listdir(source_dir):
                if item == '.github': continue
                src_path = os.path.join(source_dir, item)
                dst_path = os.path.join('.', item)
                if os.path.exists(dst_path):
                    if os.path.isdir(dst_path): shutil.rmtree(dst_path)
                    else: os.remove(dst_path)
                shutil.move(src_path, dst_path)
            shutil.rmtree('temp_extracted', ignore_errors=True)
            print('Project files successfully flattened to root.')
        else:
            print('Error: No .zip file found!')
            exit(1)
        "

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Environment
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Force Gradle 8.5 Wrapper & Build APK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
        
        # Create Gradle 8.5 wrapper configuration
        mkdir -p gradle/wrapper
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
