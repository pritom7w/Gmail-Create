name: Build Android APK Fast

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Detect, Unzip & Locate Android Project Root
      run: |
        python3 -c "
        import zipfile, os, shutil, glob

        zips = [f for f in os.listdir('.') if f.endswith('.zip') or f.endswith('.ZIP')]
        if zips:
            zip_name = zips[0]
            print(f'Found target ZIP: {zip_name}')
            with zipfile.ZipFile(zip_name, 'r') as z:
                z.extractall('extracted_temp')
            os.remove(zip_name)
            
            extracted_items = os.listdir('extracted_temp')
            # If zip contains a single root folder, unwrap it cleanly
            if len(extracted_items) == 1 and os.path.isdir(os.path.join('extracted_temp', extracted_items[0])):
                inner_dir = os.path.join('extracted_temp', extracted_items[0])
                for item in os.listdir(inner_dir):
                    src = os.path.join(inner_dir, item)
                    dst = os.path.join('.', item)
                    if os.path.exists(dst):
                        if os.path.isdir(dst): shutil.rmtree(dst)
                        else: os.remove(dst)
                    shutil.move(src, dst)
            else:
                for item in extracted_items:
                    if item == '.github': continue
                    src = os.path.join('extracted_temp', item)
                    dst = os.path.join('.', item)
                    if os.path.exists(dst):
                        if os.path.isdir(dst): shutil.rmtree(dst)
                        else: os.remove(dst)
                    shutil.move(src, dst)
            shutil.rmtree('extracted_temp')
            print('Successfully extracted and organized ZIP contents.')
        else:
            print('WARNING: No .zip file found in root!')

        # Automatically find the directory containing 'app' folder or settings.gradle
        project_root = '.'
        if not os.path.exists('settings.gradle') and not os.path.exists('build.gradle'):
            for root, dirs, files in os.walk('.'):
                if 'app' in dirs or 'settings.gradle' in files or 'build.gradle' in files:
                    project_root = root
                    break

        print(f'Android project root located at: {project_root}')
        with open('project_path.txt', 'w') as f:
            f.write(project_root)
        "

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure Pre-installed Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Generate Gradle 8.7 Wrapper & Build APK
      run: |
        set -o pipefail
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
        
        PROJ_DIR=$(cat project_path.txt)
        cd "$PROJ_DIR"
        
        # Ensure Gradle project configuration files exist
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "include ':app'" > settings.gradle
        fi
        
        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF
        fi

        if [ ! -f "gradle.properties" ]; then
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
        fi

        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log

    - name: Upload Success APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'

    - name: Upload Failure Log Artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Failed-Log
        path: '**/build_output.log'
