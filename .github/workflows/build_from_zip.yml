name: Build APK from Zip Archive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-from-zip:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Locate and Extract Zip Archive
      run: |
        echo "Scanning repository for project zip file..."
        ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
        
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No .zip project file found in the repository root!"
          exit 1
        fi
        
        echo "Found archive: $ZIP_FILE. Extracting..."
        mkdir -p extracted_project
        unzip -q "$ZIP_FILE" -d extracted_project
        
        cd extracted_project
        ITEM_COUNT=$(ls -A | wc -l)
        if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$(ls -A)" ]; then
          SINGLE_DIR=$(ls -A)
          echo "Entering root folder inside zip: $SINGLE_DIR"
          cd "$SINGLE_DIR"
        fi
        
        pwd > ../workspace_path.txt
        echo "Project root successfully located at: $(cat ../workspace_path.txt)"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "11076708"
        build-tools-version: "34.0.0"
        api-levels: "34"
        accept-android-sdk-licenses: true

    - name: Grant Gradle Wrapper Permissions & Build APK
      run: |
        WORK_DIR=$(cat workspace_path.txt)
        cd "$WORK_DIR"
        
        if [ ! -f "gradlew" ]; then
          echo "Error: gradlew not found in $WORK_DIR. Make sure your zip includes the Android project root files."
          exit 1
        fi
        
        echo "Granting execution permissions to Gradle wrapper..."
        chmod +x gradlew
        
        echo "Executing Gradle build (assembleDebug)..."
        ./gradlew assembleDebug --no-daemon

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: p7m-suite-debug-apk
        path: |
          **/build/outputs/apk/debug/app-debug.apk
