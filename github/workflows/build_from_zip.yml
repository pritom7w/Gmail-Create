name: Build APK from Zip Archive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-from-zip:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Locate and Extract Zip Archive
      run: |
        echo "Scanning repository for project zip file..."
        # Find the zip file in the root directory
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No .zip project file found in the repository root!"
          exit 1
        fi
        
        echo "Found archive: $ZIP_FILE. Extracting..."
        mkdir -p project_source
        unzip -q "$ZIP_FILE" -d project_source
        
        # Normalize directory structure if zip contains a root folder
        cd project_source
        EXTRACTED_DIR=$(ls -d */ | head -n 1)
        if [ -n "$EXTRACTED_DIR" ]; then
          echo "Moving into project directory: $EXTRACTED_DIR"
          cd "$EXTRACTED_DIR"
        }
        pwd > ../../workspace_path.txt

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Configure Gradle Wrapper Permissions & Build APK
      run: |
        WORK_DIR=$(cat workspace_path.txt)
        cd "$WORK_DIR"
        
        echo "Granting execution permissions to Gradle wrapper..."
        chmod +x gradlew
        
        echo "Executing Gradle build (assembleDebug)..."
        ./gradlew assembleDebug

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: p7m-suite-debug-apk
        path: |
          **/build/outputs/apk/debug/app-debug.apk
